# Voor wie de worker met de opdrachtregel (wrangler) wil plaatsen. Via het Cloudflare-dashboard is dit niet nodig.
name = "haven-werkuren-melding"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "WikiDave/Cewez-Calculator"
ALLOWED_ORIGIN = "https://wikidave.github.io"

# Optioneel: maximaal 5 meldingen per minuut per IP
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
